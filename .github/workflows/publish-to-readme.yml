name: Publish to ReadMe

# The spec is authored on `rebuild`. ReadMe owns the version branches and
# writes to them itself, so publishing is a rebase-and-push, never a force.
on:
  push:
    branches: [rebuild]
    paths:
      - "openapi.yaml"
      - "scripts/publish-to-readme.mjs"
      - ".github/workflows/publish-to-readme.yml"
  pull_request:
    paths:
      - "openapi.yaml"
  workflow_dispatch:
    inputs:
      branch:
        description: "ReadMe version branch to publish to"
        default: "v4.0"
      dry_run:
        description: "Show the diff without committing"
        type: boolean
        default: true

# One publish at a time, or two runs race each other onto the same branch.
concurrency:
  group: publish-to-readme
  cancel-in-progress: false

jobs:
  validate:
    name: Validate spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx redocly lint openapi.yaml

  publish:
    name: Publish
    needs: validate
    # Pull requests validate only. Nothing reaches a version branch until merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the publish rebases onto the version branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Configure committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish
        run: |
          node scripts/publish-to-readme.mjs \
            --branch "${{ inputs.branch || 'v4.0' }}" \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
